<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - EmpowerFit</title>
  <link rel="icon" type="image/x-icon" href="logo3.avif">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="form-container">
  
  <form class="glass-card auth-card animated-fade" id="loginForm">
    <a href="index.html" style="display: block; margin-bottom: 25px; text-align: center;">
      <img src="logo3.avif" alt="Gym Logo" style="width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--accent-primary); box-shadow: var(--glow-orange);" />
    </a>
    <h2 class="form-title">Sign In</h2>
    <p class="form-subtitle">Access your gym tracking dashboard</p>
    
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter your email" required autocomplete="username">
    </div>
    
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
    </div>

    <div class="forgot-link" style="text-align: right; margin-top: -10px; margin-bottom: 20px;">
      <a href="forget password.html" id="forgotPasswordLink">Forgot Password?</a>
    </div>

    <button type="submit" class="btn submit">
      Sign In
    </button>

    <p class="signup-link">
      New to EmpowerFit?
      <a href="signup.html" id="signupLink">Register Account</a>
    </p>
  </form>

  <!-- Shared & Auth-specific Scripts -->
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
