<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - EmpowerFit</title>
  <link rel="icon" type="image/x-icon" href="logo3.avif">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="form-container">
  
  <form class="glass-card auth-card animated-fade" id="signupForm">
    <a href="index.html" style="display: block; margin-bottom: 25px; text-align: center;">
      <img src="logo3.avif" alt="Gym Logo" style="width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--accent-primary); box-shadow: var(--glow-orange);" />
    </a>
    <h2 class="form-title">Create Account</h2>
    <p class="form-subtitle">Register to unlock your wellness tracker</p>
    
    <div class="form-group">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" placeholder="Enter full name" required autocomplete="name">
    </div>
    
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter email" required autocomplete="username">
    </div>
    
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" required autocomplete="new-password">
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Confirm password" required autocomplete="new-password">
    </div>

    <button type="submit" class="submit btn btn-teal" style="margin-top: 15px;">
      Sign Up
    </button>

    <p class="login-link">
      Already have an account?
      <a href="login.html" id="loginLink">Log in</a>
    </p>
  </form>

  <!-- Shared & Auth-specific Scripts -->
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
