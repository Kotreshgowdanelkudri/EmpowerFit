<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - EmpowerFit</title>
  <link rel="icon" type="image/x-icon" href="logo3.avif">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="form-container">
  
  <form class="glass-card auth-card animated-fade" id="forgotPasswordForm">
    <a href="index.html" style="display: block; margin-bottom: 25px; text-align: center;">
      <img src="logo3.avif" alt="Gym Logo" style="width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--accent-primary); box-shadow: var(--glow-orange);" />
    </a>
    <h2 class="form-title">Forgot Password?</h2>
    <p class="form-subtitle">Enter your registered email to request a reset link</p>
    
    <div class="form-group" style="margin-bottom: 25px;">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter email" required autocomplete="username">
    </div>

    <button type="submit" class="submit btn">
      Send Reset Link
    </button>

    <p class="signup-link">
      Remember password?
      <a href="login.html" id="backToLoginLink">Back to Login</a>
    </p>
  </form>

  <!-- Shared & Auth-specific Scripts -->
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
