<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Us - EmpowerFit</title>
  <link rel="icon" type="image/x-icon" href="logo3.avif">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="form-container">
  
  <form class="glass-card auth-card animated-fade" id="signupForm" style="max-width: 450px;">
    <a href="index.html" style="display: block; margin-bottom: 20px; text-align: center;">
      <img src="logo3.avif" alt="Gym Logo" style="width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--accent-primary); box-shadow: var(--glow-orange);" />
    </a>
    <h2 class="form-title">Join EmpowerFit</h2>
    <p class="form-subtitle">Choose a membership plan and register your account</p>
    
    <div class="form-group">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" placeholder="Enter full name" required autocomplete="name">
    </div>
    
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter email" required autocomplete="username">
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required autocomplete="new-password">
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm password" required autocomplete="new-password">
      </div>
    </div>

    <div class="form-group" style="margin-bottom: 25px;">
      <label for="membershipSelect">Choose Membership Plan</label>
      <select id="membershipSelect" required>
        <option value="None">None (Digital Dashboard Only)</option>
        <option value="Basic">Basic Membership ($30/mo)</option>
        <option value="Premium" selected>Premium Membership ($50/mo)</option>
        <option value="VIP">VIP Membership ($80/mo)</option>
      </select>
    </div>

    <button type="submit" class="submit btn btn-teal" style="width: 100%;">
      Create Account & Join
    </button>

    <p class="login-link">
      Already have an account?
      <a href="login.html" id="loginLink">Log in</a>
    </p>
  </form>

  <!-- Shared & Auth-specific Scripts -->
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  
  <script>
    // Pre-select plan dropdown based on query parameters (e.g. from pricing cards)
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const plan = urlParams.get('plan');
      if (plan) {
        const select = document.getElementById('membershipSelect');
        const options = Array.from(select.options);
        
        const matchingOption = options.find(opt => opt.value.toLowerCase() === plan.toLowerCase());
        if (matchingOption) {
          select.value = matchingOption.value;
        }
      }
    });
  </script>
</body>
</html>
